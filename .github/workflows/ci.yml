name: Repository Integrity & Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Markdown Links & Mermaid Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          npm install

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Integrity & Mermaid Audit Suite
        run: |
          npm test

      - name: Run Java 21 Playground Concurrency Tests
        run: |
          cd code-samples
          mvn test --batch-mode --no-transfer-progress || {
            echo "::error::Maven tests failed. Printing Surefire reports:"
            for f in target/surefire-reports/*.txt; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
            exit 1
          }
