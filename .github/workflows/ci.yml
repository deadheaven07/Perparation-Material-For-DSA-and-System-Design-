name: Repository Integrity & Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Markdown Links & Mermaid Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid Dependencies
        run: |
          npm install @mermaid-js/mermaid-cli

      - name: Run Comprehensive Repository Integrity Audit
        run: |
          python3 scratch/audit_integrity.py

      - name: Run Mermaid Diagram Syntax Validation
        run: |
          node scratch/validate_mermaid.js
